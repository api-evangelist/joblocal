aid: joblocal
name: Joblocal
description: >-
  Joblocal GmbH is a Munich-based German recruiting technology company and a
  part of the Funke Mediengruppe. With more than fifteen years of experience it
  operates a network of 41 regional job portals across Germany and, together
  with the Funke network, runs data-driven, hyper-regional recruiting campaigns
  tailored to position, location and budget for over 1,000 client companies.
  Its "Talent.KI" product applies artificial intelligence to candidate sourcing
  and regional labor-market analysis, surfacing employers where job seekers
  actually search. Joblocal was surfaced as a portfolio company of Speedinvest
  and added to the API Evangelist network. It publishes no public developer
  portal, API, or machine-readable API artifacts at this time.
